<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title">金司馬船運計算機</title>
    <link
      rel="icon"
      href="https://cdn.poedb.tw/image/Art/2DArt/minimap/player/VillageShipping.webp"
      type="image/webp"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- Google tag (gtag.js) -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-S01FYFQXS1"
  ></script>

    function gtag() {

  <body>
    <div class="container">
      <div class="header">
        <h1 data-i18n="heading">金司馬船運計算機</h1>
        <button id="langToggle" class="lang-toggle">EN</button>
      </div>
      <p data-i18n="description">從剪貼版貼上圖片以提取農作物與礦物數量並計算總價值。</p>
      <div class="input-group">
        <button id="pasteButton">
          <span class="button-text" data-i18n="pasteButton">貼上圖片</span>
          <span class="processing-text">
            <span data-i18n="processing">正在處理</span> <span class="dot-1">.</span><span class="dot-2">.</span
            ><span class="dot-3">.</span>
          </span>
        </button>
        <input
          type="text"
          id="apiKeyInput"
          data-i18n-placeholder="apiKeyPlaceholder"
          placeholder="(非必要) 你的 OCR.SPACE API 金鑰"
        />
        <a
          href="https://ocr.space/ocrapi/freekey"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="freeKey"
          >註冊免費金鑰</a
        >
      </div>
      <div class="image-mining-row">
        <div id="imageContainer"></div>
        <div id="miningContainer"></div>
      </div>
      <div id="output" class="output-container"></div>
      <div id="result" class="result"></div>
      <br />
      <hr class="style-emb" />
      <br />
      <script
        src="https://giscus.app/client.js"
        data-repo="changchiyou/crops-value-calculator"
        data-repo-id="R_kgDOMvFCkQ"
        data-category="Announcements"
        data-category-id="DIC_kwDOMvFCkc4Cib5-"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="1"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="zh-TW"
        data-loading="lazy"
        crossorigin="anonymous"
        async
      ></script>
    </div>
    <div id="imagePreview"></div>
    <script src="script.js"></script>
  </body>
</html>
